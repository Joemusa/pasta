[project]
name = "fmcg-commercial-intelligence"
version = "0.1.0"
description = "AI-powered FMCG Commercial Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
data-qa = "backend.agents.data_qa.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ARG", "UP", "RUF"]
