[project]
name = "fmcg-commercial-intelligence"
version = "0.1.0"
description = "AI-powered FMCG Commercial Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
data-qa = "backend.agents.data_qa.__main__:main"
distribution = "backend.agents.distribution.__main__:main"
integration = "backend.agents.integration.__main__:main"
price = "backend.agents.price.__main__:main"
promotion = "backend.agents.promotion.__main__:main"
brain = "backend.agents.brain.__main__:main"
storytelling = "backend.agents.storytelling.__main__:main"
inflation-cost = "backend.agents.inflation_cost.__main__:main"
consumer-retail = "backend.agents.consumer_retail.__main__:main"
rates-fx = "backend.agents.rates_fx.__main__:main"
energy-commodity = "backend.agents.energy_commodity.__main__:main"
macro-brain = "backend.agents.macro_brain.__main__:main"
social-listening = "backend.agents.social_listening.__main__:main"
consumer-sentiment = "backend.agents.consumer_sentiment.__main__:main"
consumer-needs = "backend.agents.consumer_needs.__main__:main"
social-trend = "backend.agents.social_trend.__main__:main"
social-brain = "backend.agents.social_brain.__main__:main"
dashboard = "backend.dashboard.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ARG", "UP", "RUF"]
